<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Today</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div class="panel">
      <nav class="tabs" role="tablist" aria-label="Views">
        <button class="tab on" role="tab" data-view="tasks" aria-selected="true">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7.5l2 2 3.5-3.5M4 16.5l2 2 3.5-3.5M13 7.5h7M13 16.5h7" />
          </svg>
          Tasks
        </button>
        <button class="tab" role="tab" data-view="notes" aria-selected="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 19.5l3.6-.8L19.1 8.2a2 2 0 0 0 0-2.8l-.5-.5a2 2 0 0 0-2.8 0L5.3 15.4z" />
          </svg>
          Notes
        </button>
      </nav>

      <section class="view" id="view-tasks" role="tabpanel" aria-label="Tasks">
        <header class="head">
          <div class="head-text">
            <h1>Today</h1>
            <p id="date" class="date"></p>
          </div>
          <div class="ring">
            <svg viewBox="0 0 36 36" aria-hidden="true">
              <circle class="ring-track" cx="18" cy="18" r="15.5" />
              <circle id="ringFill" class="ring-fill" cx="18" cy="18" r="15.5" />
            </svg>
            <span id="ringLabel">0</span>
          </div>
        </header>

        <form id="add" class="add" autocomplete="off">
          <input
            id="title"
            placeholder="Add a task…"
            autocomplete="off"
            spellcheck="false"
            autofocus
          />
          <button type="submit" class="add-btn" aria-label="Add task">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 5v14M5 12h14" />
            </svg>
          </button>
        </form>

        <p id="error" class="error" role="alert"></p>

        <ul id="list" class="list"></ul>
        <p id="empty" class="empty">Nothing yet. Add your first task above.</p>

        <footer class="foot">
          <span id="left">No tasks</span>
          <span class="foot-actions">
            <button id="clearDone" class="link" hidden>Clear done</button>
            <span id="reset" class="reset"></span>
          </span>
        </footer>
      </section>

      <section class="view" id="view-notes" role="tabpanel" aria-label="Notes" hidden>
        <header class="head notes-head">
          <button
            id="calToggle"
            class="cal-btn"
            aria-label="Calendar"
            aria-expanded="false"
            aria-controls="calendar"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3.5" y="5" width="17" height="15.5" rx="3" />
              <path d="M3.5 9.5h17M8 3.5v3M16 3.5v3" />
            </svg>
          </button>
          <h1 id="noteDay">Today</h1>
          <button id="pinNote" class="pin-btn" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 15v6" />
              <path d="M8.5 3.5h7l-1 5 2.5 3v3h-10v-3l2.5-3z" />
            </svg>
            <span id="pinLabel">Keep</span>
          </button>
        </header>

        <p id="noteError" class="error" role="alert"></p>

        <div class="editor">
          <textarea id="noteBody" spellcheck="true"></textarea>
          <div class="preview markdown" id="notePreview" tabindex="0" hidden></div>
          <div class="calendar" id="calendar" hidden>
            <div class="cal-head">
              <button class="cal-nav" id="calPrev" aria-label="Previous month">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6" /></svg>
              </button>
              <span class="cal-label" id="calLabel"></span>
              <button class="cal-nav" id="calNext" aria-label="Next month">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6-6 6" /></svg>
              </button>
            </div>
            <div class="cal-grid" id="calGrid" role="grid" aria-label="Days with notes"></div>
            <div class="cal-legend">
              <span><i class="dot pinned"></i>Kept forever</span>
              <span><i class="dot"></i>Has a note</span>
              <span><i class="dot archived"></i>Archived</span>
            </div>
          </div>
          <button class="save-btn" id="saveNote" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12.5l4.5 4.5L19 7.5" />
            </svg>
            Save
          </button>
          <p class="editor-empty" id="editorEmpty" hidden>No note on this day.</p>
        </div>

        <footer class="foot">
          <span id="noteInfo">Nothing saved yet</span>
          <button id="deleteNote" class="link" disabled>Delete note</button>
        </footer>
      </section>
    </div>

    <template id="item">
      <li class="row">
        <button class="check" role="checkbox" aria-checked="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="tick" d="M5.5 12.6l4.2 4.2L18.6 7.5" />
          </svg>
        </button>
        <span class="title"><span class="label"></span></span>
        <button class="remove" aria-label="Remove">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 7l10 10M17 7L7 17" />
          </svg>
        </button>
      </li>
    </template>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
